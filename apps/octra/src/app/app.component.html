@if (
  versionChecker.isNewVersionAvailable && appStorage.useMode !== LoginMode.URL
) {
  <octra-version-notification
    class="position-absolute top-0 start-50 translate-middle-x"
    [i18n]="{
      'reload now': 'g.reload now' | transloco,
      later: 'g.later' | transloco,
      'new update': {
        header: 'toasts.new update.header' | transloco,
        body: 'toasts.new update.body' | transloco,
      },
    }"
  ></octra-version-notification>
}

@if (instanceBlocked()) {
  <div class="container text-center mt-5 instance-blocked">
    <i class="bi bi-window-stack" style="font-size: 4rem; color: #f0ad4e"></i>
    <h1 class="mt-3">{{ blockedTexts.title }}</h1>
    <p class="mt-3">{{ blockedTexts.description }}</p>
    <button class="btn btn-primary mt-3" type="button" (click)="useThisTab()">
      {{ blockedTexts.button }}
    </button>
    <p class="text-muted mt-2" style="font-size: 0.8rem">
      {{ blockedTexts.hint }}
    </p>
  </div>
}

<div class="overflow-box position-relative" [class.d-none]="instanceBlocked()">
  <octra-alert id="alerts"></octra-alert>
  <octra-modal></octra-modal>
  <header>
    <octra-navigation #navigation></octra-navigation>
  </header>
  <main style="padding-top: 40px" class="h-100 flex">
    @if (environment.dev_version) {
      <div class="d-none d-md-block beta_mark text-outline-white">
        in development
      </div>
    }
    @if (environment.beta_version) {
      <div class="d-none d-md-block beta_mark text-outline-white">beta</div>
    }
    <div class="container-fluid flex h-100">
      <router-outlet></router-outlet>
    </div>
    <!-- /.container -->
  </main>
</div>
