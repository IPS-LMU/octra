<div class="container-fluid">
  @if (jsonSchema.$gui_support) {
    <form class="ocf-form">
      <octra-toolconfig-group
        [group]="form"
        [options]="options"
        (somethingChanged)="onSomethingChanged()"
      ></octra-toolconfig-group>
    </form>
  } @else {
    <p class="text-center">Form not supported by tool.</p>
  }
</div>
